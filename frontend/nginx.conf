# nginx serves the built React files AND forwards API calls to the backend services.
# "student-service", "question-service", "result-service" are Docker/Kubernetes service names.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/question/internal/ { return 403; }   # internal endpoint: not for browsers

    location /api/student/  { proxy_pass http://student-service:8001/; }
    location /api/question/ { proxy_pass http://question-service:8002/; }
    location /api/result/   { proxy_pass http://result-service:8003/; }

    location / { try_files $uri /index.html; }          # lets React Router handle the URLs
}
